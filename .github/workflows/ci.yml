name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: forwardops
          POSTGRES_PASSWORD: forwardops
          POSTGRES_DB: forwardops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forwardops -d forwardops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_ADMIN_URL: postgresql://forwardops:forwardops@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies from the lockfile
        run: uv sync --frozen --all-extras
      - name: Lint
        run: |
          uv run ruff check src tests evals
          uv run ruff format --check src tests evals
      - name: Unit tests
        run: uv run pytest tests/unit
      - name: Integration tests
        run: uv run pytest tests/integration
      - name: Deterministic evaluations
        run: uv run python -m evals.runner
