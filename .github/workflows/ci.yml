name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: forwardops
          POSTGRES_PASSWORD: forwardops
          POSTGRES_DB: forwardops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forwardops -d forwardops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_ADMIN_URL: postgresql://forwardops:forwardops@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests evals
          ruff format --check src tests evals
      - name: Unit tests
        run: pytest tests/unit
      - name: Integration tests
        run: pytest tests/integration
      - name: Stale-oracle evaluation
        run: python -m evals.runner
